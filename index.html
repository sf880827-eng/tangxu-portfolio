<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棠序問策｜網站作品集 2026</title>
<meta name="description" content="棠序問策 新世代 AI 品牌科技｜網站作品集電子書">
<link rel="stylesheet" href="assets/flipbook.css">
<link rel="stylesheet" href="assets/intro.css">
<link rel="preload" as="image" href="assets/intro/crazyos.webp" media="(min-width: 768px)">
<link rel="preload" as="image" href="assets/intro/crazyos_p.webp" media="(max-width: 767px)">
<link rel="preload" as="image" href="assets/pages/ms01.webp" media="(max-width: 767px)">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <a class="brand" href="https://tangxuai.org/" target="_blank" rel="noopener"><span class="dot"></span>棠序問策</a>
  <a class="cta" href="https://tangxuai.org/contact-us/" target="_blank" rel="noopener">預約諮詢</a>

  <!-- Desktop: page-flip book -->
  <main class="stage" id="stage" hidden>
    <div class="book-shift" id="shift"></div>
  </main>
  <nav class="controls" id="controls" aria-label="翻頁控制" hidden>
    <button id="prev" class="btn" aria-label="上一頁"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="counter"><span id="cur">01</span><i>/</i><span id="total">15</span></div>
    <button id="next" class="btn" aria-label="下一頁"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="sep"></span>
    <button id="mode" class="btn ghost" aria-label="切換單頁／雙頁" title="單頁／雙頁"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></svg></button>
    <button id="fs" class="btn ghost" aria-label="全螢幕" title="全螢幕"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>
  <div class="hint" id="hint" aria-hidden="true">← → 鍵盤翻頁　｜　拖曳頁角翻頁</div>

  <!-- Mobile: single-page swipe flip (9:16 pages) -->
  <main class="mstage" id="mstage" hidden><div class="mshift" id="mshift"></div><div class="mtip" id="mtip">左右滑動翻頁・點一下放大</div></main>
  <!-- Mobile fallback: vertical scroll -->
  <main class="scroll" id="scroll" hidden></main>
  <div class="lightbox" id="lb" hidden role="dialog" aria-label="頁面放大檢視">
    <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
    <button class="lb-close" id="lbClose" aria-label="關閉">✕</button>
    <div class="lb-num" id="lbNum"></div>
    <div class="lb-tip" id="lbTip">雙指縮放・點兩下放大</div>
  </div>

  <script src="assets/intro.js"></script>
  <script src="assets/js/page-flip.browser.js"></script>
  <script src="assets/flipbook.js"></script>
</body>
</html>
